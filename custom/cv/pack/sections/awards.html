<!--
  awards.html - fork partial for Recent Achievements: one row per entry
  (title - org, year right-aligned). Papers go here, never under Projects.
-->
<!--ENTRY-->
<div class="award-item">
  <span class="award-main"><span class="award-title">{{TITLE}}</span>{{ORG_BLOCK}}</span>
  {{YEAR_BLOCK}}
</div>
<!--ORG_BLOCK--> <span class="row-tail"><span class="award-sep">- </span><span class="award-org">{{ORG}}</span></span><!--/ORG_BLOCK-->
<!--YEAR_BLOCK--><span class="award-year">{{YEAR}}</span><!--/YEAR_BLOCK-->
<!--YEAR_EMPTY--><span class="award-year"></span><!--/YEAR_EMPTY-->
<!--/ENTRY-->
